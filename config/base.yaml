# Defaults shared by every environment. Loaded by src/common/config.py's
# load_settings() and merged with config/{env}.yaml (env from APP_ENV,
# default "dev"). New here as of Stage 1 -- didn't previously exist, so
# Settings was running purely on its Pydantic field defaults.

database:
  path: var/metadata.db
  schema_file: schemas/manifest_schema.sql

scratch:
  root: var/scratch
  purge_on_exit: true

storage:
  backend: local
  local_root: var/local_storage
  # Point this at the mount path of the external/USB/network disk holding
  # the real corpus, e.g. "/Volumes/LegalDocs" or "/mnt/legal_docs". Left
  # null by default -- src.ingestion.discovery.discover_local_documents
  # requires it to be set before Stage 0 discovery can run.
  source_root: "/Volumes/Dr. Iqbal SSD/LAW Data/English pdfs/BOOKS Law pdf"
  checksum_mode: fast
  file_extensions: [".pdf"]

pipeline:
  batch_size: 500
  checkpoint_dir: var/checkpoints
  phases: ["claim", "pull", "extract", "discover_domains"]

discovery:
  sample_min: 1500
  sample_max: 2000
  sample_seed: 42
  embedding_model_name: sentence-transformers/all-mpnet-base-v2
  embedding_batch_size: 32
  title_weight: 2.0
  toc_weight: 1.5
  body_weight: 1.0
  body_chunk_chars: 2000
  max_body_chunks: 4
  umap_n_components: 50
  umap_n_neighbors: 15
  umap_min_dist: 0.0
  umap_metric: cosine
  umap_min_docs: 50
  hdbscan_min_cluster_size: 15
  hdbscan_metric: euclidean
  top_n_domains: 3
  representative_docs_per_cluster: 8
  keywords_per_cluster: 15
  llm_model: claude-sonnet-5
  llm_max_tokens: 1024
  taxonomy_output_dir: var/taxonomy
  domain_registry_schema_file: schemas/domain_registry_schema.sql

extraction:
  max_pages: 15
  min_chars_per_page: 40
  min_alpha_ratio: 0.6
  flagged_page_ratio: 0.5
  ocr_dpi: 300
  ocr_lang: eng
  body_preview_char_limit: 20000
  signature_schema_file: schemas/signature_schema.sql

retry:
  max_attempts: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0
  multiplier: 2.0
  jitter: true

logging:
  level: INFO
  json_format: false

metrics:
  db_path: var/metrics.db




  